# Local runtime only: proxy, web, api and PostgreSQL. No workers or caches.
# Values come from .env (copy .env.example); required values fail fast.
name: hardware-store

x-django-env: &django-env
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?set DJANGO_CSRF_TRUSTED_ORIGINS in .env}
  DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-1}
  DJANGO_TRUST_PROXY_PROTO_HEADER: ${DJANGO_TRUST_PROXY_PROTO_HEADER:-0}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  DJANGO_DEFAULT_ORGANIZATION_SLUG: ${DJANGO_DEFAULT_ORGANIZATION_SLUG:-demo}
  DJANGO_TRUSTED_PROXY_HOSTS: ${DJANGO_TRUSTED_PROXY_HOSTS:-proxy}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:18.6-alpine3.24@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Not published to the host. Use `docker compose exec db psql ...` for client access.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./apps/api
      target: dev
    environment: *django-env
    # Source mounted for local reload and in-container checks; deps live in /opt/venv.
    volumes:
      - ./apps/api:/app
      # Explicitly synthetic catalog fixtures for tests and seed_synthetic (read-only).
      - ./tests/fixtures/synthetic:/tests/fixtures/synthetic:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Internal Django origin for server-side fetches (used from P1-03 on).
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  proxy:
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    ports:
      - "127.0.0.1:${PROXY_PORT:-8480}:80"
    volumes:
      - ./infra/local/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
